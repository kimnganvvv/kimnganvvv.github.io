<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiêu Đề Trang Web Của Bạn</title>
    
    <style>
        /* Một chút CSS cơ bản để trang nhìn dễ chịu hơn */
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 40px;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            max-width: 800px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Chào mừng đến với trang web của tôi</h1>
        <p>Đây là một đoạn văn bản mẫu. Bạn có thể thay đổi nội dung này bằng bất cứ thứ gì bạn muốn.</p>
        
        <h2>Các bước tiếp theo:</h2>
        <ul>
            <li>Học thêm về các thẻ HTML (h1, p, div, a...).</li>
            <li>Thêm màu sắc và bố cục bằng CSS.</li>
            <li>Tạo hiệu ứng tương tác bằng JavaScript.</li>
        </ul>
    </div>

    <script>
        console.log("Trang web đã tải thành công!");
    </script>
</body>
</html>
